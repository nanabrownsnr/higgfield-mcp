# Python project, dependency, test, and lint configuration.
[project]
name = "higgfield-mcp"
version = "0.1.0"
description = "Higgfield MCP - API key management and generation server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.104.0",
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "pymongo>=4.18.2",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]